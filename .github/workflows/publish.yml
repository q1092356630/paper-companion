name: Publish verified build
on:
  workflow_run:
    workflows: [Build desktop releases]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build desktop releases run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-paper-companion
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful build and source provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run || github.event.workflow_run.id }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/build-run.json"
          sha=$(node -e 'const r=require(process.env.RUNNER_TEMP+"/build-run.json"); if(r.conclusion!=="success" || r.head_branch!=="main" || r.head_repository.full_name!==process.env.GITHUB_REPOSITORY || r.path!==".github/workflows/build.yml" || r.event==="pull_request" || !/^[a-f0-9]{40}$/.test(r.head_sha)) process.exit(1); console.log(r.head_sha)')
          # Only the publisher itself may differ from the exact tested app source.
          if ! git diff --quiet "$sha" HEAD -- . ':!.github/workflows/publish.yml'; then
            echo 'A newer app revision exists; wait for its build.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --detach "$sha"
          version=$(node -p 'require("./package.json").version')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version v$version already exists; releases are immutable."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run=$BUILD_RUN" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.publish == 'true'
        with:
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          pattern: PaperCompanion-*
          path: artifacts
          merge-multiple: true
      - name: Verify all three platform archives
        if: steps.source.outputs.publish == 'true'
        run: |
          node -e 'const fs=require("fs"),v=require("./package.json").version; for(const p of ["windows-x64","mac-arm64","mac-x64"]){const f="artifacts/PaperCompanion-"+v+"-"+p+".zip"; if(!fs.statSync(f).size || !fs.existsSync(f+".sha256")) process.exit(1)}'
          cd artifacts
          sha256sum --check *.sha256
      - name: Publish preview release
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release create "v$VERSION" artifacts/* --draft --prerelease --target "$SOURCE_SHA" --title "文献伴读 v$VERSION · Windows / macOS" --notes-file docs/RELEASE_NOTES.md
          gh release edit "v$VERSION" --draft=false
