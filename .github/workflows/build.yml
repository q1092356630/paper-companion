name: Build desktop releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.8'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm setup:pdf
      - run: pnpm test:runtime
      - run: pnpm test:desktop
      - run: pnpm package:desktop
      - run: pnpm release:archive
      - uses: actions/upload-artifact@v4
        with:
          name: PaperCompanion-${{ matrix.label }}
          path: |
            release/PaperCompanion-*.zip
            release/PaperCompanion-*.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish all three platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "文献伴读 $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
